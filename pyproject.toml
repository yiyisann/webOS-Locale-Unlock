[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webos-locale-unlock"
version = "0.1.0"
description = "Audit and enable hidden UI languages on already-rooted LG webOS TVs without changing region"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "webOS Locale Unlock contributors"}]
dependencies = ["websocket-client>=1.8,<2"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows"]

[project.urls]
Repository = "https://github.com/yiyisann/webOS-Locale-Unlock"

[project.scripts]
webos-locale = "webos_locale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webos_locale = ["runtime.js"]
